name: Build and Lint

permissions:
  contents: read
  pull-requests: write

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # the Node.js versions to build on
        node-version: [20.x, 22.x, 24.x]
        homebridge-version: [1.11.4, 2.1.1]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }} 
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Install Homebridge compatibility version
        if: matrix.homebridge-version == '1.11.4'
        run: npm install --no-save --package-lock=false --ignore-scripts homebridge@${{ matrix.homebridge-version }}

      - name: Lint the project
        run: npm run lint

      - name: Build the project
        run: npm run build

      - name: Run tests
        run: npm test
